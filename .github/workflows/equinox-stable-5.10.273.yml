name: Equinox Linux 5.10.273 source-port staging

on:
  push:
    branches:
      - update/equinox-linux-5.10.273-staging-20261031
    paths:
      - .github/workflows/equinox-stable-5.10.273.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equinox-stable-staging
  cancel-in-progress: true

jobs:
  integrate:
    name: Stage real upstream changes with three-way source merges
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source-port helper
        run: |
          python3 -m py_compile scripts/equinox/merge-stable-5.10.273.py
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -1)" = "269"
      - name: Integrate Linux 5.10.273 source changes into staging
        run: |
          python3 scripts/equinox/merge-stable-5.10.273.py
