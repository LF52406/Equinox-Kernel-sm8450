name: Equinox 5.10.269 validation

on:
  pull_request:
    branches:
      - lineage-24.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mondrian-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Equinox 5.10.269 staging
        uses: actions/checkout@v4
        with:
          ref: equinox-5.10.269-staging
          fetch-depth: 2

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          BASE="149fa3416c693f2ccfb22ad19c433375a72e78f7"
          STAGING="4730daa0e2e6261d027c586769b96fe8cd3d3186"

          test "$(git rev-parse HEAD)" = "$STAGING"
          test "$(sed -n 's/^VERSION = //p' Makefile | head -n1)" = "5"
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n1)" = "10"
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = "269"

          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD

          # Device-facing configuration and KMI symbol lists must not be silently
          # rewritten by an LTS merge. These are the same inputs used by mondrian's
          # Android BoardConfig.
          git diff --exit-code "$BASE" HEAD -- \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/mondrian_GKI.config \
            arch/arm64/configs/vendor/debugfs.config \
            android/abi_gki_aarch64_qcom \
            android/abi_gki_aarch64_xiaomi \
            modules.list.msm.waipio \
            modules.vendor_blocklist.msm.waipio \
            build.config.common

          echo "Source invariants verified."

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio rsync xz-utils zstd

      - name: Install Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-clang"
          ARCHIVE="$RUNNER_TEMP/clang-r416183b.tar.gz"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-d2-s2-release/clang-r416183b.tar.gz"

          if curl -fL --retry 4 --retry-delay 5 "$URL" -o "$ARCHIVE"; then
            tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/android-clang"
          else
            echo "Archive download failed; falling back to a sparse Git checkout."
            rm -rf "$RUNNER_TEMP/android-clang"
            git clone --depth=1 --filter=blob:none --sparse \
              --branch android12L-d2-s2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$RUNNER_TEMP/clang-prebuilts"
            git -C "$RUNNER_TEMP/clang-prebuilts" sparse-checkout set clang-r416183b
            mv "$RUNNER_TEMP/clang-prebuilts/clang-r416183b" "$RUNNER_TEMP/android-clang"
          fi

          test -x "$RUNNER_TEMP/android-clang/bin/clang"
          echo "$RUNNER_TEMP/android-clang/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/android-clang/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/android-clang/bin/clang" --version
          "$RUNNER_TEMP/android-clang/bin/ld.lld" --version

      - name: Generate mondrian kernel configuration exactly like Lineage
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export TARGET_PRODUCT=mondrian
          MAKE_ARGS=(O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld TARGET_PRODUCT=mondrian)

          rm -rf out
          mkdir -p out

          # Lineage kernel.mk uses the first TARGET_KERNEL_CONFIG as the base,
          # then merges each *.config fragment followed by olddefconfig.
          cp arch/arm64/configs/gki_defconfig out/.config
          make "${MAKE_ARGS[@]}" olddefconfig

          for fragment in \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/mondrian_GKI.config \
            arch/arm64/configs/vendor/debugfs.config; do
            scripts/kconfig/merge_config.sh -m -O out out/.config "$fragment"
            make "${MAKE_ARGS[@]}" olddefconfig
          done

          # Hard assertions for device-critical options from mondrian/xiaomi config.
          grep -qx 'CONFIG_ARCH_WAIPIO=y' out/.config
          grep -qx 'CONFIG_MI_CHARGER_M81=y' out/.config
          grep -qx 'CONFIG_MI_THERMAL_MULTI_CHARGE=y' out/.config
          grep -qx 'CONFIG_INPUT_AW862XX_HAPTIC=m' out/.config
          grep -qx 'CONFIG_INPUT_AW86927_HAPTIC=m' out/.config
          grep -qx 'CONFIG_FINGERPRINT_GOODIX_TEE=m' out/.config
          grep -qx 'CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=m' out/.config
          grep -qx 'CONFIG_EROFS_FS=y' out/.config

          echo "Mondrian configuration generated successfully."

      - name: Build Image and in-tree modules
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export TARGET_PRODUCT=mondrian
          MAKE_ARGS=(O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld TARGET_PRODUCT=mondrian)

          make -j2 "${MAKE_ARGS[@]}" Image modules

          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/Module.symvers

          echo "Kernel release: $(make -s "${MAKE_ARGS[@]}" kernelrelease)"
          ls -lh out/arch/arm64/boot/Image out/vmlinux out/Module.symvers

      - name: Post-build sanity checks
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E '<<<<<<<|=======|>>>>>>>' \
              --exclude-dir=.git --exclude='*.orig' --exclude='*.rej' .; then
            echo "::error::Merge conflict markers found in source tree."
            exit 1
          fi

          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = "269"
          echo "Equinox 5.10.269 core build validation passed."
